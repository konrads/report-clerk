name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Test
        run: uv run --frozen pytest -q --cov
      - name: Mock run
        run: uv run --frozen report-clerk run --mock --no-email --no-ai --out out
