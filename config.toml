# report-clerk config.
# Secrets don't go here: they come from env vars or .env.
# Only the names in .env.example are read from the environment; everything else is set here.

timezone = "Australia/Brisbane"   # reports end yesterday in this timezone

[shopify]
shop = "company-dev"            # <shop>.myshopify.com
api_version = "2026-07"

[xero]
# Xero data comes only from web-app report exports. Local only: a login (with 2FA) may open a browser window.
org_short_code = "SWP1y"                    # from reporting.xero.com/!SWP1y/...
profile_dir = "~/.report-clerk/xero-profile"  # dedicated browser profile; holds the Xero session
headed = false                              # true: show the browser for every export
screenshot_dir = "out"                      # screenshot of the page when an export fails

[claude]
# Auth: CLAUDE_OAUTH_TOKEN (subscription, from `claude setup-token`), else CLAUDE_API_KEY,
# else the local `claude auth login`.
model = "claude-opus-5-5"
effort = "medium"           # low | medium | high | xhigh | max
setup_dir = "claude"        # permissions, CLI flags, prompt, skills: the only source for what Claude may do

# Reports run in order; each writes <id>-<date>.xlsx (Summary sheet first) to the --out folder.
# Each id needs src/report_clerk/reports/<id>.py. Comment out a block to skip it.
# Optional per report: title, days (default 30), prompt (adds a Claude summary to the section),
# options (report-specific).

[[reports]]
id = "sales_summary"
title = "Sales, last 30 days"
days = 30
# Only grant tools whose data may be shared with the report's readers.
claude_tools = ["shopify_sales_comparison", "shopify_daily_sales", "shopify_sales_by_category", "shopify_top_products"]
prompt = """
Compare sales across ice baths, saunas and e-bikes against the previous period.
List the points of interest: categories growing or falling, unusual days, anything worth a follow-up.
"""

# Xero-sourced rows of the Warehouse Operations Metrics workbook, one column per completed month.
[[reports]]
id = "warehouse_metrics"
title = "Warehouse operations metrics"

[reports.options]
# months = 12              # optional: completed months back; unset = all history
fulfilled_order_accounts = ["200 - Sales Income (B2C)", "206 - Sales - Sydney Gym Fitout Co."]
fulfilled_order_sources = ["Receivable Invoice"]
min_order_amount = 0.01    # 1-cent invoices are not orders
cogs_accounts = ["310 - Cost of Goods Sold (B2C)", "312 - Cost of Goods Sold - Sydney Gym Fitout Co.", "313 - Cost of Goods Sold (B2B)"]
freight_accounts = ["320 - Freight Cost"]
rent_accounts = ["469 - Rent Cost"]
rent_contacts = ["Michael Oldmeadow"]   # warehouse landlord; the account also holds office rent
warehouse_expense_accounts = ["454 - Warehouse Cost"]
inventory_adjustment_accounts = ["Scrapped - Scrapped Inventory", "InvAdj - Inventory Adjustment"]
average_order_value_label = "Average value of invoices"   # Executive Summary row; unverified, comment out to skip

[reports.options.freight_carriers]   # carrier = description prefix
"PPND" = "PPND ENTERPRISES"
"Grace Removals" = "Grace Removals"
"Mainfreight Distribution" = "Mainfreight Distribution"
"TNT Express" = "TNT Express"
"FreightFixer" = "FreightFixer"
"Aramex" = "Aramex"
"Australia Post" = "Australia Post"
