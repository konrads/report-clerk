[project]
name = "report-clerk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "claude-agent-sdk==0.2.184",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "playwright>=1.50",
]

[project.scripts]
report-clerk = "report_clerk.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
source = ["report_clerk"]
omit = ["*/services/browser.py"]  # drives a live website; not runnable in tests

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
# Xero navigation and the report templates' export() steps drive the live web app, like browser.py.
exclude_also = ['if __name__ == "__main__":', 'def export\(', 'class XeroSession', 'def session\(']
